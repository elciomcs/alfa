<div style="font-family:Arial,sans-serif;padding:14px;border:1px solid #9994;border-radius:14px">
  <div style="font-size:18px;font-weight:700;margin-bottom:12px">🎧 __TITLE__</div>

  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button onclick="startSession()">▶ Iniciar</button>
    <button onclick="pauseSession()">⏸ Pausar</button>
    <button onclick="resumeSession()">⏯ Continuar</button>
    <button onclick="stopSession()">⏹ Parar</button>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
    <label>
      Voz
      <input id="voiceVol" type="range" min="0.25" max="1" value="0.88" step="0.05" style="width:100%">
    </label>

    <label>
      Som
      <input id="soundVol" type="range" min="0.05" max="0.60" value="0.22" step="0.01" style="width:100%">
    </label>
  </div>

  <div id="status" style="font-size:13px;margin-top:10px">Pronto.</div>

  <div style="height:7px;background:#9993;border-radius:7px;overflow:hidden;margin-top:8px">
    <div id="bar" style="height:100%;width:0%;background:currentColor;opacity:.55"></div>
  </div>

  <div id="clock" style="font-size:12px;opacity:.7;margin-top:5px">00:00</div>
</div>

<script>
const introSrc = __INTRO__;
const prompts = __PROMPTS__;
const duration = __DURATION__;
const mode = __MODE__;

let ctx = null;
let master = null;
let nodes = [];
let rightOsc = null;
let lfoOsc = null;
let introAudio = null;
let activeVoice = null;
let startTime = null;
let timer = null;
let stopped = true;

prompts.forEach(p => p.played = false);

function status(text) {
  document.getElementById("status").innerText = text;
}

function fmt(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return m + ":" + s;
}

function makeContext() {
  if (!ctx || ctx.state === "closed") {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function createBinaural(base, firstDiff) {
  const merger = ctx.createChannelMerger(2);
  const leftGain = ctx.createGain();
  const rightGain = ctx.createGain();
  const left = ctx.createOscillator();
  const right = ctx.createOscillator();

  leftGain.gain.value = 0.90;
  rightGain.gain.value = 0.90;

  left.type = "sine";
  right.type = "sine";

  left.frequency.value = base;
  right.frequency.value = base + firstDiff;

  left.connect(leftGain);
  right.connect(rightGain);

  leftGain.connect(merger, 0, 0);
  rightGain.connect(merger, 0, 1);

  merger.connect(master);

  left.start();
  right.start();

  rightOsc = right;

  nodes.push(
    left,
    right,
    leftGain,
    rightGain,
    merger
  );
}

function createNoturno() {
  const mix = ctx.createGain();
  const o1 = ctx.createOscillator();
  const o2 = ctx.createOscillator();
  const mod = ctx.createGain();
  const lfo = ctx.createOscillator();
  const depth = ctx.createGain();

  mix.gain.value = 0.70;
  mod.gain.value = 0.62;
  depth.gain.value = 0.38;

  o1.type = "sine";
  o2.type = "sine";
  lfo.type = "sine";

  o1.frequency.value = 100;
  o2.frequency.value = 106;
  lfo.frequency.value = 6;

  lfo.connect(depth);
  depth.connect(mod.gain);

  o1.connect(mix);
  o2.connect(mix);
  mix.connect(mod);
  mod.connect(master);

  o1.start();
  o2.start();
  lfo.start();

  rightOsc = o2;
  lfoOsc = lfo;

  nodes.push(
    o1,
    o2,
    lfo,
    mix,
    mod,
    depth
  );
}

function prepareSound() {
  master = ctx.createGain();

  master.gain.setValueAtTime(
    0.0001,
    ctx.currentTime
  );

  master.connect(ctx.destination);

  if (mode === "amor") {
    createBinaural(150, 8);
  }

  else if (mode === "proximo") {
    createBinaural(145, 10);
  }

  else if (mode === "anseio") {
    createBinaural(110, 8);
  }

  else if (mode === "noturno") {
    createNoturno();
  }
}

function scheduleSound() {
  const now = ctx.currentTime;

  if (mode === "amor" && rightOsc) {
    rightOsc.frequency.cancelScheduledValues(now);

    rightOsc.frequency.setValueAtTime(
      158,
      now
    );

    rightOsc.frequency.setValueAtTime(
      160,
      now + 120
    );

    rightOsc.frequency.setValueAtTime(
      160,
      now + 600
    );

    rightOsc.frequency.linearRampToValueAtTime(
      170,
      now + duration
    );
  }

  else if (mode === "proximo" && rightOsc) {
    rightOsc.frequency.cancelScheduledValues(now);

    rightOsc.frequency.setValueAtTime(
      155,
      now
    );

    rightOsc.frequency.setValueAtTime(
      155,
      now + Math.max(duration - 120, 0)
    );

    rightOsc.frequency.linearRampToValueAtTime(
      157,
      now + duration
    );
  }

  else if (mode === "anseio" && rightOsc) {
    rightOsc.frequency.cancelScheduledValues(now);

    rightOsc.frequency.setValueAtTime(
      118,
      now
    );

    rightOsc.frequency.setValueAtTime(
      120,
      now + duration * 0.20
    );

    rightOsc.frequency.setValueAtTime(
      120,
      now + duration * 0.50
    );

    rightOsc.frequency.linearRampToValueAtTime(
      124,
      now + duration * 0.80
    );

    rightOsc.frequency.linearRampToValueAtTime(
      128,
      now + duration
    );
  }

  else if (mode === "noturno" && rightOsc && lfoOsc) {
    rightOsc.frequency.cancelScheduledValues(now);

    rightOsc.frequency.setValueAtTime(
      106,
      now
    );

    rightOsc.frequency.setValueAtTime(
      106,
      now + 1770
    );

    rightOsc.frequency.linearRampToValueAtTime(
      102.5,
      now + 1830
    );

    rightOsc.frequency.setValueAtTime(
      102.5,
      now + 3600
    );

    lfoOsc.frequency.cancelScheduledValues(now);

    lfoOsc.frequency.setValueAtTime(
      6,
      now
    );

    lfoOsc.frequency.setValueAtTime(
      6,
      now + 1770
    );

    lfoOsc.frequency.linearRampToValueAtTime(
      2.5,
      now + 1830
    );

    lfoOsc.frequency.setValueAtTime(
      2.5,
      now + 3600
    );
  }
}

function releaseSound() {
  const volume = parseFloat(
    document.getElementById("soundVol").value
  );

  scheduleSound();

  master.gain.cancelScheduledValues(
    ctx.currentTime
  );

  master.gain.setValueAtTime(
    0.0001,
    ctx.currentTime
  );

  master.gain.exponentialRampToValueAtTime(
    Math.max(volume, 0.001),
    ctx.currentTime + 0.35
  );

  startTime = ctx.currentTime;

  status("🎵 Áudio iniciado.");

  prompts.forEach(
    p => p.played = false
  );

  timer = setInterval(() => {
    if (
      !ctx ||
      startTime === null ||
      stopped
    ) {
      return;
    }

    const elapsed = Math.min(
      duration,
      ctx.currentTime - startTime
    );

    document.getElementById(
      "clock"
    ).innerText =
      fmt(elapsed)
      + " / "
      + fmt(duration);

    document.getElementById(
      "bar"
    ).style.width =
      ((elapsed / duration) * 100)
      .toFixed(2)
      + "%";

    prompts.forEach(p => {
      if (!p.played && elapsed >= p.at) {
        p.played = true;
        playVoice(p.src);
      }
    });

    if (elapsed >= duration) {
      finishSession();
    }

  }, 500);
}

function playVoice(src) {
  return new Promise(resolve => {
    if (!src) {
      resolve();
      return;
    }

    const audio = new Audio(src);

    activeVoice = audio;

    audio.volume = parseFloat(
      document.getElementById("voiceVol").value
    );

    if (master && ctx) {
      master.gain.cancelScheduledValues(
        ctx.currentTime
      );

      master.gain.setValueAtTime(
        Math.max(master.gain.value, 0.001),
        ctx.currentTime
      );

      master.gain.linearRampToValueAtTime(
        0.035,
        ctx.currentTime + 0.20
      );
    }

    audio.onended = () => {
      if (master && ctx && !stopped) {
        const volume = parseFloat(
          document.getElementById("soundVol").value
        );

        master.gain.cancelScheduledValues(
          ctx.currentTime
        );

        master.gain.setValueAtTime(
          Math.max(master.gain.value, 0.001),
          ctx.currentTime
        );

        master.gain.linearRampToValueAtTime(
          Math.max(volume, 0.001),
          ctx.currentTime + 0.35
        );
      }

      activeVoice = null;

      status(
        "🎵 Continue..."
      );

      resolve();
    };

    audio.onerror =
      resolve;

    audio
      .play()
      .catch(
        resolve
      );
  });
}

async function startSession() {
  stopSession(
    false
  );

  stopped =
    false;

  makeContext();

  try {
    await ctx.resume();
  }
  catch(e) {}

  /*
    O motor de som é criado
    no próprio clique do usuário.

    Durante a narração,
    o ganho fica praticamente zerado.
  */

  prepareSound();

  status(
    "🎙️ Narração..."
  );

  introAudio =
    new Audio(
      introSrc
    );

  introAudio.volume =
    parseFloat(
      document
        .getElementById(
          "voiceVol"
        )
        .value
    );

  introAudio.onended =
    () => {

      if (stopped)
        return;

      setTimeout(
        () =>
          releaseSound(),
        200
      );

    };

  introAudio.onerror =
    () => {

      setTimeout(
        () =>
          releaseSound(),
        200
      );

    };

  introAudio
    .play()
    .catch(
      () => {

        status(
          "Toque novamente em Iniciar."
        );

      }
    );
}

function pauseSession() {
  if (stopped)
    return;

  try {
    if (
      introAudio &&
      !introAudio.paused
    ) {
      introAudio.pause();
    }
  }
  catch(e) {}

  try {
    if (
      activeVoice &&
      !activeVoice.paused
    ) {
      activeVoice.pause();
    }
  }
  catch(e) {}

  try {
    if (
      ctx &&
      ctx.state === "running"
    ) {
      ctx.suspend();
    }
  }
  catch(e) {}

  status(
    "⏸ Pausado."
  );
}

function resumeSession() {
  if (stopped)
    return;

  try {
    if (
      ctx &&
      ctx.state === "suspended"
    ) {
      ctx.resume();
    }
  }
  catch(e) {}

  try {
    if (
      activeVoice &&
      activeVoice.paused
    ) {
      activeVoice.play();
    }

    else if (
      introAudio &&
      introAudio.paused &&
      startTime === null
    ) {
      introAudio.play();
    }
  }
  catch(e) {}

  status(
    "▶ Continuando."
  );
}

function stopSession(
  showStatus = true
) {
  stopped =
    true;

  if (timer) {
    clearInterval(
      timer
    );

    timer =
      null;
  }

  try {
    if (introAudio) {
      introAudio.pause();

      introAudio.currentTime =
        0;
    }
  }
  catch(e) {}

  try {
    if (activeVoice) {
      activeVoice.pause();

      activeVoice.currentTime =
        0;
    }
  }
  catch(e) {}

  nodes.forEach(
    node => {

      try {
        if (node.stop)
          node.stop();
      }
      catch(e) {}

      try {
        if (node.disconnect)
          node.disconnect();
      }
      catch(e) {}

    }
  );

  nodes =
    [];

  try {
    if (
      ctx &&
      ctx.state !== "closed"
    ) {
      ctx.close();
    }
  }
  catch(e) {}

  ctx =
    null;

  master =
    null;

  rightOsc =
    null;

  lfoOsc =
    null;

  startTime =
    null;

  introAudio =
    null;

  activeVoice =
    null;

  if (showStatus) {
    status(
      "⏹ Encerrado."
    );

    document
      .getElementById(
        "bar"
      )
      .style
      .width =
        "0%";

    document
      .getElementById(
        "clock"
      )
      .innerText =
        "00:00";
  }
}

function finishSession() {
  if (timer) {
    clearInterval(
      timer
    );

    timer =
      null;
  }

  status(
    "✅ Concluído."
  );

  document
    .getElementById(
      "bar"
    )
    .style
    .width =
      "100%";

  setTimeout(
    () =>
      stopSession(
        false
      ),
    1000
  );
}

document
  .getElementById(
    "soundVol"
  )
  .addEventListener(
    "input",
    event => {

      if (
        master &&
        ctx &&
        !stopped &&
        startTime !== null
      ) {

        master.gain
          .setTargetAtTime(
            parseFloat(
              event.target.value
            ),
            ctx.currentTime,
            0.12
          );

      }

    }
  );

</script>
