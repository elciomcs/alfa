<div style="font-family:Arial,sans-serif;padding:14px;border:1px solid #9994;border-radius:14px">
  <div style="font-size:18px;font-weight:700;margin-bottom:12px">🎧 __TITLE__</div>

  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button id="startBtn" type="button">▶ Iniciar</button>
    <button id="pauseBtn" type="button">⏸ Pausar</button>
    <button id="resumeBtn" type="button">⏯ Continuar</button>
    <button id="stopBtn" type="button">⏹ Parar</button>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
    <label>
      Voz
      <input id="voiceVol" type="range" min="0" max="1" value="0.88" step="0.01" style="width:100%">
    </label>

    <label>
      Som
      <input id="soundVol" type="range" min="0" max="1" value="0.45" step="0.01" style="width:100%">
    </label>
  </div>

  <div id="status" style="font-size:13px;margin-top:10px">Pronto.</div>

  <div style="height:7px;background:#9993;border-radius:7px;overflow:hidden;margin-top:8px">
    <div id="bar" style="height:100%;width:0%;background:currentColor;opacity:.55"></div>
  </div>

  <div id="clock" style="font-size:12px;opacity:.7;margin-top:5px">00:00</div>

  <div id="youtubeSection" style="display:none;margin-top:14px">
    <div style="font-size:12px;opacity:.75;margin-bottom:6px">
      Música de fundo autorizada
    </div>
    <div id="youtubePlayer"></div>
  </div>
</div>

<script>
(() => {

const introSources = __INTROS__;
const prompts = __PROMPTS__;
const duration = __DURATION__;
const mode = __MODE__;
const backgroundMusicSrc = __BACKGROUND_MUSIC__;
const waitingMusicSrc = __WAITING_MUSIC__;

const WAITING_START = 178; // 2:58
const WAITING_END = 300;   // 5:00

const YESHUA_VIDEO_ID = "5jUAsyqt8ic";

let ctx = null;
let master = null;
let nodes = [];
let leftOsc = null;
let rightOsc = null;
let leftBinauralGain = null;
let rightBinauralGain = null;
let lfoOsc = null;
let introAudio = null;
let activeVoice = null;
let startTime = null;
let timer = null;
let stopped = true;

let ytPlayer = null;
let ytReady = false;
let ytSessionActive = false;

let backgroundAudio = null;
let backgroundMusicActive = false;

let waitingAudio = null;
let waitingMusicActive = false;
let waitingMusicUnlocked = false;

prompts.forEach(p => p.played = false);

function status(text) {
  document.getElementById("status").innerText = text;
}

function fmt(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return m + ":" + s;
}

function soundValue() {
  return Math.max(
    0,
    Math.min(
      1,
      parseFloat(
        document.getElementById("soundVol").value
      )
    )
  );
}

function voiceValue() {
  return Math.max(
    0,
    Math.min(
      1,
      parseFloat(
        document.getElementById("voiceVol").value
      )
    )
  );
}

// Volume global das camadas neuroacústicas.
// O slider continua 0..100%, mas limitamos a saída máxima
// para preservar conforto no fone.
function sessionMasterVolume() {
  return soundValue() * 0.52;
}

function getIntroSource() {
  if (mode !== "amor") {
    return (
      introSources.padrao
      ||
      Object.values(introSources)[0]
    );
  }

  const hour = new Date().getHours();

  if (hour >= 5 && hour < 12) {
    return introSources.manha;
  }

  if (hour >= 12 && hour < 18) {
    return introSources.tarde;
  }

  return introSources.noite;
}

function youtubeVolume() {
  const value = Math.round(soundValue() * 100);
  return Math.max(8, Math.min(35, value));
}

function makeContext() {
  if (!ctx || ctx.state === "closed") {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
  }
}


/* ==========================================================
   YOUTUBE — ITEM 1
   ========================================================== */

function initYouTube() {
  // Desativado: o Item 1 agora usa o MP3 local autorizado.
  return;
}

function onYouTubeIframeAPIReady() {
  if (mode !== "amor") {
    return;
  }

  ytPlayer = new YT.Player(
    "youtubePlayer",
    {
      width: "100%",
      height: "200",
      videoId: YESHUA_VIDEO_ID,

      playerVars: {
        controls: 1,
        playsinline: 1,
        rel: 0
      },

      events: {
        onReady: function() {
          ytReady = true;
        },

        onStateChange: function(event) {
          if (
            ytSessionActive &&
            event.data === YT.PlayerState.ENDED
          ) {
            try {
              ytPlayer.seekTo(0, true);
              ytPlayer.playVideo();
            } catch(e) {}
          }
        },

        onAutoplayBlocked: function() {
          status(
            "A música foi bloqueada pelo navegador. Toque no player do YouTube e depois em Iniciar."
          );
        },

        onError: function() {
          status(
            "Não foi possível reproduzir a música do YouTube. O restante do áudio continuará normalmente."
          );
        }
      }
    }
  );
}

function armYouTube() {
  // Desativado: o Item 1 agora usa o MP3 local autorizado.
  return true;
}

function releaseYouTube() {
  if (
    mode !== "amor" ||
    !ytReady ||
    !ytPlayer
  ) {
    return;
  }

  try {
    // Reinicia a música no começo após a narração.
    ytPlayer.seekTo(0, true);
    ytPlayer.setVolume(
      youtubeVolume()
    );
    ytPlayer.playVideo();
  }
  catch(e) {}
}

function duckYouTube() {
  if (
    mode !== "amor" ||
    !ytReady ||
    !ytPlayer
  ) {
    return;
  }

  try {
    ytPlayer.setVolume(5);
  }
  catch(e) {}
}

function restoreYouTube() {
  if (
    mode !== "amor" ||
    !ytReady ||
    !ytPlayer
  ) {
    return;
  }

  try {
    ytPlayer.setVolume(
      youtubeVolume()
    );
  }
  catch(e) {}
}

function pauseYouTube() {
  if (
    mode === "amor" &&
    ytReady &&
    ytPlayer
  ) {
    try {
      ytPlayer.pauseVideo();
    }
    catch(e) {}
  }
}

function resumeYouTube() {
  if (
    mode === "amor" &&
    ytReady &&
    ytPlayer &&
    ytSessionActive
  ) {
    try {
      ytPlayer.playVideo();
    }
    catch(e) {}
  }
}

function resetYouTube() {
  ytSessionActive = false;

  if (
    mode === "amor" &&
    ytReady &&
    ytPlayer
  ) {
    try {
      ytPlayer.pauseVideo();
      ytPlayer.seekTo(0, true);
      ytPlayer.setVolume(0);
    }
    catch(e) {}
  }
}


function waitingMusicVolume() {
  // Alfa e Ômega = música de espera, sempre como fundo.
  // Usa o mesmo slider "Som", mas com teto bem inferior.
  return soundValue() * 0.08;
}


/* ==========================================================
   MÚSICA DE ESPERA — ALFA E ÔMEGA
   Trecho 2:58 -> 5:00
   ========================================================== */

function prepareWaitingMusic() {
  if (!waitingMusicSrc || waitingAudio) {
    return;
  }

  waitingAudio = new Audio(waitingMusicSrc);
  waitingAudio.preload = "auto";

  // O volume escolhido na barra "Som" já vale antes
  // de qualquer reprodução ou início de sessão.
  waitingAudio.volume = waitingMusicVolume();

  waitingAudio.addEventListener(
    "loadedmetadata",
    () => {
      try {
        if (
          waitingAudio.duration > WAITING_START
        ) {
          waitingAudio.currentTime = WAITING_START;
        }
      }
      catch(e) {}
    }
  );

  waitingAudio.addEventListener(
    "timeupdate",
    () => {
      if (
        waitingMusicActive
        &&
        waitingAudio.currentTime >= WAITING_END
      ) {
        try {
          waitingAudio.currentTime = WAITING_START;
          waitingAudio.play().catch(() => {});
        }
        catch(e) {}
      }
    }
  );

  waitingAudio.addEventListener(
    "ended",
    () => {
      if (waitingMusicActive) {
        try {
          waitingAudio.currentTime = WAITING_START;
          waitingAudio.play().catch(() => {});
        }
        catch(e) {}
      }
    }
  );
}

function startWaitingMusic() {
  if (!waitingMusicSrc || !stopped) {
    return;
  }

  prepareWaitingMusic();

  if (!waitingAudio) {
    return;
  }

  waitingMusicActive = true;

  try {
    // Reaplica SEMPRE o volume atual do slider antes de voltar.
    waitingAudio.volume = waitingMusicVolume();

    if (
      waitingAudio.currentTime < WAITING_START
      ||
      waitingAudio.currentTime >= WAITING_END
    ) {
      waitingAudio.currentTime = WAITING_START;
    }

    const promise = waitingAudio.play();

    if (promise && promise.then) {
      promise
        .then(() => {
          waitingMusicUnlocked = true;
        })
        .catch(() => {
          // Autoplay com áudio pode ser bloqueado pelo navegador móvel.
          // Não exibimos nenhuma mensagem na interface.
        });
    }
  }
  catch(e) {}
}

function stopWaitingMusic() {
  waitingMusicActive = false;

  if (!waitingAudio) {
    return;
  }

  try {
    waitingAudio.pause();
  }
  catch(e) {}
}

function resetWaitingMusic() {
  stopWaitingMusic();

  if (!waitingAudio) {
    return;
  }

  try {
    waitingAudio.currentTime = WAITING_START;
  }
  catch(e) {}
}


/* ==========================================================
   MÚSICA LOCAL — ITEM 2
   ========================================================== */

function backgroundMusicVolume() {
  // Música emocional = apenas cama sonora.
  // Binaural e demais recursos neuroacústicos ficam à frente.
  return soundValue() * 0.015;
}

function armBackgroundMusic() {
  if (!backgroundMusicSrc) {
    return true;
  }

  try {
    backgroundAudio = new Audio(backgroundMusicSrc);
    backgroundAudio.loop = true;
    backgroundAudio.preload = "auto";
    // A música é iniciada em silêncio apenas para preservar
    // a autorização de reprodução no celular.
    backgroundAudio.volume = 0;
    backgroundMusicActive = true;

    const promise = backgroundAudio.play();

    if (promise && promise.catch) {
      promise.catch(() => {
        status(
          "O navegador bloqueou a música. Toque novamente em Iniciar."
        );
      });
    }

    return true;
  }
  catch(e) {
    backgroundMusicActive = false;
    return false;
  }
}

function releaseBackgroundMusic() {
  if (
    !backgroundMusicActive ||
    !backgroundAudio
  ) {
    return;
  }

  try {
    backgroundAudio.currentTime = 0;
    backgroundAudio.volume = backgroundMusicVolume();

    if (backgroundAudio.paused) {
      backgroundAudio.play().catch(() => {});
    }
  }
  catch(e) {}
}

function duckBackgroundMusic() {
  if (
    !backgroundMusicActive ||
    !backgroundAudio
  ) {
    return;
  }

  try {
    backgroundAudio.volume =
      backgroundMusicVolume() * 0.18;
  }
  catch(e) {}
}

function restoreBackgroundMusic() {
  if (
    !backgroundMusicActive ||
    !backgroundAudio
  ) {
    return;
  }

  try {
    backgroundAudio.volume = backgroundMusicVolume();
  }
  catch(e) {}
}

function pauseBackgroundMusic() {
  if (
    backgroundMusicActive &&
    backgroundAudio
  ) {
    try {
      backgroundAudio.pause();
    }
    catch(e) {}
  }
}

function resumeBackgroundMusic() {
  if (
    backgroundMusicActive &&
    backgroundAudio
  ) {
    try {
      backgroundAudio.play().catch(() => {});
    }
    catch(e) {}
  }
}

function resetBackgroundMusic() {
  backgroundMusicActive = false;

  if (backgroundAudio) {
    try {
      backgroundAudio.pause();
      backgroundAudio.currentTime = 0;
    }
    catch(e) {}
  }

  backgroundAudio = null;
}


/* ==========================================================
   BINAURAL
   ========================================================== */

function createBinaural(base, firstDiff) {
  const merger = ctx.createChannelMerger(2);
  const leftGain = ctx.createGain();
  const rightGain = ctx.createGain();

  const left = ctx.createOscillator();
  const right = ctx.createOscillator();

  // Binaural = estrutura frequencial.
  // Mantido estável em cada ouvido, sem movimento estéreo.
  leftGain.gain.value = 0.78;
  rightGain.gain.value = 0.78;

  left.type = "sine";
  right.type = "sine";

  left.frequency.value = base;
  right.frequency.value = base + firstDiff;

  left.connect(leftGain);
  right.connect(rightGain);

  leftGain.connect(merger, 0, 0);
  rightGain.connect(merger, 0, 1);

  merger.connect(master);

  left.start();
  right.start();

  leftOsc = left;
  rightOsc = right;
  leftBinauralGain = leftGain;
  rightBinauralGain = rightGain;

  nodes.push(
    left,
    right,
    leftGain,
    rightGain,
    merger
  );
}


/* ==========================================================
   RESPIRAÇÃO SONORA
   ========================================================== */

function createBreathingGuide() {
  if (mode === "noturno") {
    return;
  }

  const carrier1 = ctx.createOscillator();
  const carrier2 = ctx.createOscillator();

  const carrierGain1 = ctx.createGain();
  const carrierGain2 = ctx.createGain();

  const breathGain = ctx.createGain();

  const breathLfo = ctx.createOscillator();
  const breathDepth = ctx.createGain();

  const filter = ctx.createBiquadFilter();

  carrier1.type = "sine";
  carrier2.type = "triangle";

  carrier1.frequency.value = 174;
  carrier2.frequency.value = 261.63;

  carrierGain1.gain.value = 0.050;
  carrierGain2.gain.value = 0.014;

  // Respiração = estrutura corporal.
  // Centro baixo + modulação suave de volume.
  breathGain.gain.value = 0.050;

  // 0,10 Hz = ciclo sonoro de 10 segundos.
  // A onda sobe e desce continuamente, funcionando
  // como guia auditiva suave de inspiração/expiração.
  breathLfo.type = "sine";
  breathLfo.frequency.value = 0.10;

  breathDepth.gain.value = 0.034;

  filter.type = "lowpass";
  filter.frequency.value = 700;
  filter.Q.value = 0.35;

  breathLfo.connect(breathDepth);
  breathDepth.connect(breathGain.gain);

  carrier1.connect(carrierGain1);
  carrier2.connect(carrierGain2);

  carrierGain1.connect(filter);
  carrierGain2.connect(filter);

  filter.connect(breathGain);
  breathGain.connect(master);

  carrier1.start();
  carrier2.start();
  breathLfo.start();

  nodes.push(
    carrier1,
    carrier2,
    carrierGain1,
    carrierGain2,
    breathGain,
    breathLfo,
    breathDepth,
    filter
  );
}


/* ==========================================================
   PAD AMBIENTE — ITENS 2 E 3
   ========================================================== */

function createAmbientPad() {
  // Item 3 ainda não possui MP3.
  // Este pad funciona como a música lenta/ambiente.
  // Ele permanece central; o movimento espacial é de outra camada.
  if (mode !== "anseio") {
    return;
  }

  const padGain = ctx.createGain();

  const p1 = ctx.createOscillator();
  const p2 = ctx.createOscillator();
  const p3 = ctx.createOscillator();

  const g1 = ctx.createGain();
  const g2 = ctx.createGain();
  const g3 = ctx.createGain();

  const filter = ctx.createBiquadFilter();
  const filterLfo = ctx.createOscillator();
  const filterDepth = ctx.createGain();

  padGain.gain.value = 0.055;

  p1.type = "sine";
  p2.type = "triangle";
  p3.type = "sine";

  p1.frequency.value = 130.81;
  p2.frequency.value = 196.00;
  p3.frequency.value = 261.63;

  g1.gain.value = 0.30;
  g2.gain.value = 0.12;
  g3.gain.value = 0.07;

  filter.type = "lowpass";
  filter.frequency.value = 820;
  filter.Q.value = 0.35;

  // Movimento tímbrico muito lento, sem mover esquerda/direita.
  filterLfo.type = "sine";
  filterLfo.frequency.value = 0.015;
  filterDepth.gain.value = 140;

  filterLfo.connect(filterDepth);
  filterDepth.connect(filter.frequency);

  p1.connect(g1);
  p2.connect(g2);
  p3.connect(g3);

  g1.connect(filter);
  g2.connect(filter);
  g3.connect(filter);

  filter.connect(padGain);
  padGain.connect(master);

  p1.start();
  p2.start();
  p3.start();
  filterLfo.start();

  nodes.push(
    padGain,
    p1,
    p2,
    p3,
    g1,
    g2,
    g3,
    filter,
    filterLfo,
    filterDepth
  );

  const now = ctx.currentTime;

  createBell(now + 90, 523.25);
  createBell(now + 180, 659.25);
  createBell(now + 240, 783.99);
}


function createBell(atTime, frequency) {
  const bell = ctx.createOscillator();
  const overtone = ctx.createOscillator();

  const gain = ctx.createGain();
  const overtoneGain = ctx.createGain();

  bell.type = "sine";
  overtone.type = "sine";

  bell.frequency.value = frequency;
  overtone.frequency.value = frequency * 2.01;

  gain.gain.setValueAtTime(
    0.0001,
    atTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.035,
    atTime + 0.03
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    atTime + 2.5
  );

  overtoneGain.gain.value = 0.20;

  bell.connect(
    gain
  );

  overtone.connect(
    overtoneGain
  );

  overtoneGain.connect(
    gain
  );

  gain.connect(
    master
  );

  bell.start(
    atTime
  );

  overtone.start(
    atTime
  );

  bell.stop(
    atTime + 2.7
  );

  overtone.stop(
    atTime + 2.7
  );

  nodes.push(
    bell,
    overtone,
    gain,
    overtoneGain
  );
}



/* ==========================================================
   ESTIMULAÇÃO BILATERAL SUAVE
   ========================================================== */

function createBilateralLayer() {
  if (
    mode !== "amor" &&
    mode !== "proximo" &&
    mode !== "anseio"
  ) {
    return;
  }

  // Textura muito suave, independente do binaural e da música.
  // Ela se move lentamente esquerda <-> direita.
  const bufferLength = Math.max(
    1,
    Math.floor(ctx.sampleRate * 2)
  );

  const buffer = ctx.createBuffer(
    1,
    bufferLength,
    ctx.sampleRate
  );

  const data = buffer.getChannelData(0);

  let smooth = 0;

  for (let i = 0; i < bufferLength; i++) {
    const white = Math.random() * 2 - 1;

    // Suaviza o ruído para criar uma textura "aérea".
    smooth =
      0.985 * smooth
      +
      0.015 * white;

    data[i] = smooth * 2.2;
  }

  const source = ctx.createBufferSource();
  const highpass = ctx.createBiquadFilter();
  const lowpass = ctx.createBiquadFilter();
  const layerGain = ctx.createGain();

  const panner = ctx.createStereoPanner();
  const panLfo = ctx.createOscillator();
  const panDepth = ctx.createGain();

  source.buffer = buffer;
  source.loop = true;

  highpass.type = "highpass";
  highpass.frequency.value = 180;

  lowpass.type = "lowpass";
  lowpass.frequency.value = 1250;
  lowpass.Q.value = 0.25;

  // Item 2 recebe um pouco mais de presença espacial.
  if (mode === "proximo") {
    layerGain.gain.value = 0.022;
  }
  else if (mode === "anseio") {
    layerGain.gain.value = 0.018;
  }
  else {
    layerGain.gain.value = 0.016;
  }

  // Um ciclo completo esquerda -> direita -> esquerda
  // leva aproximadamente 12 segundos.
  panLfo.type = "sine";
  panLfo.frequency.value = 1 / 12;

  // Não chega a 100% de cada lado para continuar confortável.
  panDepth.gain.value = 0.72;

  source.connect(highpass);
  highpass.connect(lowpass);
  lowpass.connect(layerGain);
  layerGain.connect(panner);
  panner.connect(master);

  panLfo.connect(panDepth);
  panDepth.connect(panner.pan);

  source.start();
  panLfo.start();

  nodes.push(
    source,
    highpass,
    lowpass,
    layerGain,
    panner,
    panLfo,
    panDepth
  );
}


/* ==========================================================
   NOTURNO
   ========================================================== */

function createNoturno() {
  const mix = ctx.createGain();

  const o1 = ctx.createOscillator();
  const o2 = ctx.createOscillator();

  const mod = ctx.createGain();

  const lfo = ctx.createOscillator();
  const depth = ctx.createGain();

  mix.gain.value = 0.70;
  mod.gain.value = 0.62;
  depth.gain.value = 0.38;

  o1.type = "sine";
  o2.type = "sine";
  lfo.type = "sine";

  o1.frequency.value = 100;
  o2.frequency.value = 106;
  lfo.frequency.value = 6;

  lfo.connect(
    depth
  );

  depth.connect(
    mod.gain
  );

  o1.connect(
    mix
  );

  o2.connect(
    mix
  );

  mix.connect(
    mod
  );

  mod.connect(
    master
  );

  o1.start();
  o2.start();
  lfo.start();

  rightOsc = o2;
  lfoOsc = lfo;

  nodes.push(
    o1,
    o2,
    lfo,
    mix,
    mod,
    depth
  );
}


/* ==========================================================
   PREPARA ÁUDIO
   ========================================================== */

function prepareSound() {
  master = ctx.createGain();

  // Narração inicial totalmente seca:
  // todas as camadas Web Audio começam em silêncio absoluto.
  master.gain.setValueAtTime(
    0,
    ctx.currentTime
  );

  master.connect(ctx.destination);

  if (mode === "amor") {
    // 1) Binaural = estrutura frequencial
    createBinaural(150, 10);

    // 2) Respiração = estrutura corporal
    createBreathingGuide();

    // 3) Música lenta = MP3 Yeshua (HTML Audio)
    //    é iniciada fora do Web Audio.

    // 4) Bilateral = movimento atencional/espacial
    createBilateralLayer();
  }

  else if (mode === "proximo") {
    // 1) Binaural = estrutura frequencial
    createBinaural(145, 10);

    // 2) Respiração = estrutura corporal
    createBreathingGuide();

    // 3) Música lenta = MP3 For the One (HTML Audio)
    //    é iniciada fora do Web Audio.

    // 4) Bilateral = movimento atencional/espacial
    createBilateralLayer();
  }

  else if (mode === "anseio") {
    // 1) Binaural = estrutura frequencial
    createBinaural(110, 10);

    // 2) Respiração = estrutura corporal
    createBreathingGuide();

    // 3) Música lenta = MP3 local "Conexão Arcanjo Miguel"
    //    é iniciada fora do Web Audio.

    // 4) Bilateral = movimento atencional/espacial
    createBilateralLayer();
  }

  else if (mode === "noturno") {
    createNoturno();
  }
}


/* ==========================================================
   PROGRESSÃO DAS FREQUÊNCIAS
   ========================================================== */

function scheduleSound() {
  const now = ctx.currentTime;

  // ITEM 1 — AMOR A DEUS — 7 MINUTOS
  // 0:00–3:00   Alfa 10 Hz
  // 3:00–4:00   transição Alfa -> Theta
  // 4:00–7:00   Theta 6 Hz

  if (
    mode === "amor"
    &&
    rightOsc
  ) {
    const base = 150;

    rightOsc.frequency.cancelScheduledValues(now);

    rightOsc.frequency.setValueAtTime(
      base + 10,
      now
    );

    rightOsc.frequency.setValueAtTime(
      base + 10,
      now + 180
    );

    rightOsc.frequency.linearRampToValueAtTime(
      base + 6,
      now + 240
    );

    rightOsc.frequency.setValueAtTime(
      base + 6,
      now + 420
    );
  }

  // ITEM 2 — AMOR AO PRÓXIMO — 5 MINUTOS
  // 0:00–2:00   Alfa 10 Hz
  // 2:00–3:00   transição Alfa -> Theta
  // 3:00–5:00   Theta 6 Hz

  else if (
    mode === "proximo"
    &&
    rightOsc
  ) {
    const base = 145;

    rightOsc.frequency.cancelScheduledValues(now);

    rightOsc.frequency.setValueAtTime(
      base + 10,
      now
    );

    rightOsc.frequency.setValueAtTime(
      base + 10,
      now + 120
    );

    rightOsc.frequency.linearRampToValueAtTime(
      base + 6,
      now + 180
    );

    rightOsc.frequency.setValueAtTime(
      base + 6,
      now + 300
    );
  }


  // ITEM 3
  // 0:00–1:30   Alfa 10 Hz
  // 1:30–2:30   transição para Theta
  // 2:30–3:30   Theta 6 Hz
  // 3:30–4:00   transição para Gamma
  // 4:00–5:00   Gamma 35 Hz
  //
  // Fase final:
  // ouvido esquerdo = 742 Hz
  // ouvido direito  = 777 Hz
  // diferença binaural = 35 Hz

  else if (
    mode === "anseio"
    &&
    leftOsc
    &&
    rightOsc
  ) {
    leftOsc.frequency.cancelScheduledValues(now);
    rightOsc.frequency.cancelScheduledValues(now);

    // Alfa 10 Hz
    leftOsc.frequency.setValueAtTime(
      110,
      now
    );

    rightOsc.frequency.setValueAtTime(
      120,
      now
    );

    leftOsc.frequency.setValueAtTime(
      110,
      now + 90
    );

    rightOsc.frequency.setValueAtTime(
      120,
      now + 90
    );

    // Transição Alfa -> Theta
    rightOsc.frequency.linearRampToValueAtTime(
      116,
      now + 150
    );

    // Theta 6 Hz
    leftOsc.frequency.setValueAtTime(
      110,
      now + 210
    );

    rightOsc.frequency.setValueAtTime(
      116,
      now + 210
    );

    // Transição para os portadores Gamma.
    leftOsc.frequency.linearRampToValueAtTime(
      742,
      now + 240
    );

    rightOsc.frequency.linearRampToValueAtTime(
      777,
      now + 240
    );

    // 742/777 Hz soam muito mais agudos.
    // O ganho cai suavemente antes do Gamma.
    if (leftBinauralGain && rightBinauralGain) {
      leftBinauralGain.gain.cancelScheduledValues(now);
      rightBinauralGain.gain.cancelScheduledValues(now);

      leftBinauralGain.gain.setValueAtTime(0.78, now);
      rightBinauralGain.gain.setValueAtTime(0.78, now);

      leftBinauralGain.gain.setValueAtTime(0.78, now + 210);
      rightBinauralGain.gain.setValueAtTime(0.78, now + 210);

      leftBinauralGain.gain.linearRampToValueAtTime(0.14, now + 240);
      rightBinauralGain.gain.linearRampToValueAtTime(0.14, now + 240);

      leftBinauralGain.gain.setValueAtTime(0.14, now + 300);
      rightBinauralGain.gain.setValueAtTime(0.14, now + 300);
    }

    // Gamma 35 Hz no último minuto.
    leftOsc.frequency.setValueAtTime(
      742,
      now + 300
    );

    rightOsc.frequency.setValueAtTime(
      777,
      now + 300
    );
  }


  // ITEM 4

  else if (
    mode === "noturno"
    &&
    rightOsc
    &&
    lfoOsc
  ) {
    rightOsc.frequency.cancelScheduledValues(
      now
    );

    rightOsc.frequency.setValueAtTime(
      106,
      now
    );

    rightOsc.frequency.setValueAtTime(
      106,
      now + 1770
    );

    rightOsc.frequency.linearRampToValueAtTime(
      102.5,
      now + 1830
    );

    rightOsc.frequency.setValueAtTime(
      102.5,
      now + 3600
    );

    lfoOsc.frequency.cancelScheduledValues(
      now
    );

    lfoOsc.frequency.setValueAtTime(
      6,
      now
    );

    lfoOsc.frequency.setValueAtTime(
      6,
      now + 1770
    );

    lfoOsc.frequency.linearRampToValueAtTime(
      2.5,
      now + 1830
    );

    lfoOsc.frequency.setValueAtTime(
      2.5,
      now + 3600
    );
  }
}


/* ==========================================================
   LIBERA SOM APÓS NARRAÇÃO
   ========================================================== */

function releaseSound() {
  const volume = sessionMasterVolume();

  scheduleSound();

  master.gain.cancelScheduledValues(
    ctx.currentTime
  );

  // Só agora, após a narração inicial, entram
  // binaural + respiração + bilateral + música.
  master.gain.setValueAtTime(
    0,
    ctx.currentTime
  );

  master.gain.linearRampToValueAtTime(
    volume,
    ctx.currentTime + 0.35
  );

  releaseYouTube();
  releaseBackgroundMusic();

  startTime = ctx.currentTime;

  status(
    "🎵 Áudio iniciado."
  );

  prompts.forEach(
    p => p.played = false
  );

  timer = setInterval(
    () => {

      if (
        !ctx ||
        startTime === null ||
        stopped
      ) {
        return;
      }

      const elapsed = Math.min(
        duration,
        ctx.currentTime - startTime
      );

      document.getElementById(
        "clock"
      ).innerText =
        fmt(elapsed)
        + " / "
        + fmt(duration);

      document.getElementById(
        "bar"
      ).style.width =
        ((elapsed / duration) * 100)
        .toFixed(2)
        + "%";

      prompts.forEach(
        p => {

          if (
            !p.played
            &&
            elapsed >= p.at
          ) {
            p.played = true;

            playVoice(
              p.src
            );
          }

        }
      );

      if (
        elapsed >= duration
      ) {
        finishSession();
      }

    },
    500
  );
}


/* ==========================================================
   NARRAÇÕES INTERMEDIÁRIAS
   ========================================================== */

function playVoice(src) {
  return new Promise(
    resolve => {

      if (!src) {
        resolve();
        return;
      }

      const audio =
        new Audio(src);

      activeVoice =
        audio;

      audio.volume =
        voiceValue();

      if (
        master
        &&
        ctx
      ) {
        master.gain.cancelScheduledValues(
          ctx.currentTime
        );

        master.gain.setValueAtTime(
          Math.max(
            0,
            master.gain.value
          ),
          ctx.currentTime
        );

        master.gain.linearRampToValueAtTime(
          sessionMasterVolume() * 0.12,
          ctx.currentTime + 0.20
        );
      }

      duckYouTube();
      duckBackgroundMusic();

      audio.onended =
        () => {

          if (
            master
            &&
            ctx
            &&
            !stopped
          ) {
            const volume =
              sessionMasterVolume();

            master.gain.cancelScheduledValues(
              ctx.currentTime
            );

            master.gain.setValueAtTime(
              Math.max(
                0,
                master.gain.value
              ),
              ctx.currentTime
            );

            master.gain.linearRampToValueAtTime(
              volume,
              ctx.currentTime + 0.35
            );
          }

          restoreYouTube();
          restoreBackgroundMusic();

          activeVoice =
            null;

          status(
            "🎵 Continue..."
          );

          resolve();
        };

      audio.onerror =
        resolve;

      audio
        .play()
        .catch(
          resolve
        );
    }
  );
}


/* ==========================================================
   INICIAR
   ========================================================== */

async function startSession() {
  stopWaitingMusic();

  stopSession(
    false,
    false
  );

  stopped =
    false;

  if (
    mode === "amor"
    &&
    !armYouTube()
  ) {
    stopped = true;
    return;
  }

  if (
    backgroundMusicSrc
    &&
    !armBackgroundMusic()
  ) {
    stopped = true;
    return;
  }

  makeContext();

  try {
    await ctx.resume();
  }
  catch(e) {}

  // Toda a estrutura Web Audio é criada
  // no mesmo toque do usuário.
  prepareSound();

  status(
    "🎙️ Narração..."
  );

  introAudio =
    new Audio(
      getIntroSource()
    );

  introAudio.volume =
    voiceValue();

  introAudio.onended =
    () => {

      if (stopped) {
        return;
      }

      setTimeout(
        () =>
          releaseSound(),
        200
      );
    };

  introAudio.onerror =
    () => {

      setTimeout(
        () =>
          releaseSound(),
        200
      );
    };

  introAudio
    .play()
    .catch(
      () => {

        status(
          "Toque novamente em Iniciar."
        );

      }
    );
}


/* ==========================================================
   PAUSAR
   ========================================================== */

function pauseSession() {
  if (stopped) {
    return;
  }

  try {
    if (
      introAudio &&
      !introAudio.paused
    ) {
      introAudio.pause();
    }
  }
  catch(e) {}

  try {
    if (
      activeVoice &&
      !activeVoice.paused
    ) {
      activeVoice.pause();
    }
  }
  catch(e) {}

  try {
    if (
      ctx &&
      ctx.state === "running"
    ) {
      ctx.suspend();
    }
  }
  catch(e) {}

  pauseYouTube();
  pauseBackgroundMusic();

  status(
    "⏸ Pausado."
  );
}


/* ==========================================================
   CONTINUAR
   ========================================================== */

function resumeSession() {
  if (stopped) {
    return;
  }

  try {
    if (
      ctx &&
      ctx.state === "suspended"
    ) {
      ctx.resume();
    }
  }
  catch(e) {}

  try {
    if (
      activeVoice &&
      activeVoice.paused
    ) {
      activeVoice.play();
    }

    else if (
      introAudio &&
      introAudio.paused &&
      startTime === null
    ) {
      introAudio.play();
    }
  }
  catch(e) {}

  resumeYouTube();
  resumeBackgroundMusic();

  status(
    "▶ Continuando."
  );
}


/* ==========================================================
   PARAR
   ========================================================== */

function stopSession(
  showStatus=true,
  resumeWaiting=true
) {
  stopped =
    true;

  if (timer) {
    clearInterval(
      timer
    );

    timer =
      null;
  }

  try {
    if (introAudio) {
      introAudio.pause();
      introAudio.currentTime = 0;
    }
  }
  catch(e) {}

  try {
    if (activeVoice) {
      activeVoice.pause();
      activeVoice.currentTime = 0;
    }
  }
  catch(e) {}

  nodes.forEach(
    node => {

      try {
        if (node.stop) {
          node.stop();
        }
      }
      catch(e) {}

      try {
        if (node.disconnect) {
          node.disconnect();
        }
      }
      catch(e) {}

    }
  );

  nodes =
    [];

  resetYouTube();
  resetBackgroundMusic();

  try {
    if (
      ctx &&
      ctx.state !== "closed"
    ) {
      ctx.close();
    }
  }
  catch(e) {}

  ctx =
    null;

  master =
    null;

  leftOsc =
    null;

  rightOsc =
    null;

  leftBinauralGain =
    null;

  rightBinauralGain =
    null;

  lfoOsc =
    null;

  startTime =
    null;

  introAudio =
    null;

  activeVoice =
    null;

  if (showStatus) {
    status(
      "⏹ Encerrado."
    );

    document.getElementById(
      "bar"
    ).style.width =
      "0%";

    document.getElementById(
      "clock"
    ).innerText =
      "00:00";
  }

  if (resumeWaiting) {
    startWaitingMusic();
  }
}


/* ==========================================================
   FINAL
   ========================================================== */

function finishSession() {
  if (timer) {
    clearInterval(
      timer
    );

    timer =
      null;
  }

  status(
    "✅ Concluído."
  );

  document.getElementById(
    "bar"
  ).style.width =
    "100%";

  setTimeout(
    () =>
      stopSession(
        false,
        true
      ),
    1000
  );
}


/* ==========================================================
   VOLUME
   ========================================================== */


document
  .getElementById(
    "voiceVol"
  )
  .addEventListener(
    "input",
    event => {
      const volume =
        Math.max(
          0,
          Math.min(
            1,
            parseFloat(event.target.value)
          )
        );

      if (introAudio) {
        introAudio.volume = volume;
      }

      if (activeVoice) {
        activeVoice.volume = volume;
      }
    }
  );


document
  .getElementById(
    "soundVol"
  )
  .addEventListener(
    "input",
    event => {
      const value =
        Math.max(
          0,
          Math.min(
            1,
            parseFloat(event.target.value)
          )
        );

      // Web Audio: binaural + respiração + bilateral.
      if (
        master &&
        ctx &&
        !stopped &&
        startTime !== null
      ) {
        master.gain.cancelScheduledValues(
          ctx.currentTime
        );

        master.gain.setTargetAtTime(
          value * 0.52,
          ctx.currentTime,
          0.05
        );
      }

      // Música da sessão.
      if (
        backgroundMusicActive &&
        backgroundAudio
      ) {
        backgroundAudio.volume =
          backgroundMusicVolume();
      }

      // Música de espera, inclusive antes da sessão.
      if (waitingAudio) {
        waitingAudio.volume =
          waitingMusicVolume();
      }

      // YouTube legado, se algum dia estiver ativo.
      if (
        mode === "amor" &&
        ytSessionActive
      ) {
        restoreYouTube();
      }
    }
  );


// Controles do player.
document
  .getElementById("startBtn")
  .addEventListener("click", startSession);

document
  .getElementById("pauseBtn")
  .addEventListener("click", pauseSession);

document
  .getElementById("resumeBtn")
  .addEventListener("click", resumeSession);

document
  .getElementById("stopBtn")
  .addEventListener(
    "click",
    () => stopSession(true, true)
  );


initYouTube();

prepareWaitingMusic();

// Primeira tentativa: toca imediatamente se o navegador permitir.
startWaitingMusic();

function unlockWaitingMusic() {
  if (
    stopped
    &&
    waitingMusicSrc
    &&
    !waitingMusicUnlocked
  ) {
    startWaitingMusic();
  }
}

// Agora o script está no documento principal do Streamlit.
// Assim, qualquer primeira interação na página pode liberar
// a música de espera sem exibir mensagem.
document.addEventListener(
  "pointerdown",
  unlockWaitingMusic,
  { capture: true, passive: true }
);

document.addEventListener(
  "touchstart",
  unlockWaitingMusic,
  { capture: true, passive: true }
);

document.addEventListener(
  "click",
  unlockWaitingMusic,
  { capture: true, passive: true }
);

document.addEventListener(
  "keydown",
  unlockWaitingMusic,
  { capture: true }
);


})();
</script>
